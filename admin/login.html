<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Admin PT. Bravo Komando Group</title>
  <link rel="icon" href="../images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    body { background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .login-wrap { width: 100%; max-width: 26rem; }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo img { width: 64px; height: 64px; object-fit: contain; margin: 0 auto 1rem; }
    .login-logo h1 { color: #fff; font-size: 1.5rem; font-weight: 900; }
    .login-logo p  { color: #64748b; font-size: .875rem; margin-top: .25rem; }
    .login-card {
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
      border-radius: 1.5rem; padding: 2rem;
    }
    .login-card h2 { color: #fff; font-size: 1.125rem; font-weight: 700; margin-bottom: 1.5rem; }
    .login-label  { font-size: .875rem; font-weight: 500; color: #94a3b8; display: block; margin-bottom: .4rem; }
    .login-input  {
      width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
      color: #fff; border-radius: .75rem; padding: .75rem 1rem; font-size: .875rem;
      outline: none; transition: border-color .2s; font-family: inherit;
    }
    .login-input::placeholder { color: #475569; }
    .login-input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.15); }
    .login-form { display: flex; flex-direction: column; gap: 1rem; }
    .login-btn {
      width: 100%; background: #0ea5e9; color: #fff; border: none;
      border-radius: .75rem; padding: .875rem; font-size: .9rem; font-weight: 700;
      cursor: pointer; transition: background .2s; margin-top: .5rem; font-family: inherit;
    }
    .login-btn:hover { background: #0284c7; }
    .login-btn:disabled { background: #334155; cursor: not-allowed; }
    .login-error {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2);
      color: #f87171; font-size: .8rem; padding: .75rem 1rem; border-radius: .625rem;
    }
    .login-footer { text-align: center; color: #334155; font-size: .75rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <img src="../images/bkGroup.png" alt="PT. Bravo Komando Group" />
      <h1>Admin Panel</h1>
      <p>PT. Bravo Komando Group</p>
    </div>
    <div class="login-card">
      <h2>Masuk ke Dashboard</h2>
      <div id="loginError" class="login-error hidden"></div>
      <form class="login-form" onsubmit="handleLogin(event)">
        <div>
          <label class="login-label">Email</label>
          <input id="loginEmail" type="email" class="login-input" placeholder="admin@bravokomando.com" required />
        </div>
        <div>
          <label class="login-label">Password</label>
          <input id="loginPassword" type="password" class="login-input" placeholder="••••••••" required />
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Masuk</button>
      </form>
    </div>
    <p class="login-footer">© <span id="yr"></span> PT. Bravo Komando Group</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="admin.js"></script>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear()

    // redirect if already logged in
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) location.href = 'dashboard.html'
    })

    async function handleLogin(e) {
      e.preventDefault()
      const btn   = document.getElementById('loginBtn')
      const errEl = document.getElementById('loginError')
      errEl.classList.add('hidden')
      btn.disabled = true
      btn.textContent = 'Memproses...'

      const { error } = await sb.auth.signInWithPassword({
        email:    document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value,
      })

      if (error) {
        errEl.textContent = 'Email atau password salah.'
        errEl.classList.remove('hidden')
        btn.disabled = false
        btn.textContent = 'Masuk'
        return
      }
      location.href = 'dashboard.html'
    }
  </script>
</body>
</html>
