<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Admin Bravo Komando</title>
  <link rel="icon" href="../images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-wrap">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../images/bkGroup.png" alt="BK Group" width="36" height="36" />
      <div>
        <p class="sidebar-logo-title">BRAVO KOMANDO</p>
        <p class="sidebar-logo-sub">Admin Panel</p>
      </div>
    </div>
    <div id="sidebar"></div>
  </aside>

  <!-- Main -->
  <div class="admin-main">
    <header class="admin-header">
      <h1>Dashboard</h1>
      <div class="admin-header-right" id="adminHeaderRight"></div>
    </header>

    <div class="page-body">

      <!-- Stat Cards -->
      <div class="stat-grid" id="statGrid">
        <div class="stat-card skeleton" style="height:6rem;"></div>
        <div class="stat-card skeleton" style="height:6rem;"></div>
        <div class="stat-card skeleton" style="height:6rem;"></div>
        <div class="stat-card skeleton" style="height:6rem;"></div>
        <div class="stat-card skeleton" style="height:6rem;"></div>
        <div class="stat-card skeleton" style="height:6rem;"></div>
      </div>

      <!-- Lamaran Terbaru -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--border);">
          <h2 style="font-size:.9rem;font-weight:800;color:var(--text);">Lamaran Terbaru</h2>
          <a href="lamaran.html" style="color:var(--primary);font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:.25rem;">
            Lihat semua
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
        <div id="lamaranTerbaru">
          <div class="loading-center"><div class="spinner"></div></div>
        </div>
      </div>

    </div><!-- /page-body -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
<script>
const STAT_DEFS = [
  { key: 'totalLowongan', label: 'Total Lowongan',  bg: 'bg-blue-50',   ic: '#3b82f6', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>', href: 'lowongan.html' },
  { key: 'lowonganAktif', label: 'Lowongan Aktif',  bg: 'bg-green-50',  ic: '#22c55e', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', href: 'lowongan.html' },
  { key: 'totalLamaran',  label: 'Total Lamaran',   bg: 'bg-purple-50', ic: '#a855f7', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>', href: 'lamaran.html' },
  { key: 'lamaranBaru',   label: 'Lamaran Baru',    bg: 'bg-orange-50', ic: '#f97316', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>', href: 'lamaran.html' },
  { key: 'totalLayanan',  label: 'Total Layanan',   bg: 'bg-sky-50',    ic: '#0ea5e9', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>', href: 'layanan.html' },
  { key: 'totalTim',      label: 'Anggota Tim',     bg: 'bg-teal-50',   ic: '#14b8a6', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>', href: 'tim.html' },
]

async function loadDashboard() {
  const [
    { count: totalLowongan },
    { count: lowonganAktif },
    { count: totalLamaran },
    { count: lamaranBaru },
    { count: totalLayanan },
    { count: totalTim },
    { data: lamaran },
  ] = await Promise.all([
    sb.from('lowongan').select('*', { count: 'exact', head: true }),
    sb.from('lowongan').select('*', { count: 'exact', head: true }).eq('status', 'aktif'),
    sb.from('lamaran').select('*', { count: 'exact', head: true }),
    sb.from('lamaran').select('*', { count: 'exact', head: true }).eq('status', 'baru'),
    sb.from('layanan').select('*', { count: 'exact', head: true }),
    sb.from('tim').select('*', { count: 'exact', head: true }).eq('aktif', true),
    sb.from('lamaran').select('*, lowongan(posisi)').order('created_at', { ascending: false }).limit(5),
  ])

  const stats = { totalLowongan, lowonganAktif, totalLamaran, lamaranBaru, totalLayanan, totalTim }

  document.getElementById('statGrid').innerHTML = STAT_DEFS.map(d => `
    <a href="${d.href}" class="stat-card">
      <div class="stat-icon" style="background:${d.ic}18;">
        <span style="color:${d.ic};">${d.icon}</span>
      </div>
      <p class="stat-val">${stats[d.key] ?? 0}</p>
      <p class="stat-lbl">${d.label}</p>
    </a>
  `).join('')

  const tbody = lamaran && lamaran.length > 0
    ? lamaran.map(item => {
        const s = STATUS_LAMARAN[item.status] || { label: item.status, cls: 'badge-gray' }
        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:.75rem;">
                <div style="width:2rem;height:2rem;border-radius:50%;background:rgba(14,165,233,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  <span style="color:#0ea5e9;font-size:.7rem;font-weight:800;">${esc((item.nama||'P')[0].toUpperCase())}</span>
                </div>
                <div>
                  <p style="font-weight:700;font-size:.875rem;color:var(--text);">${esc(item.nama)}</p>
                  <p style="font-size:.75rem;color:var(--light);">${esc(item.lowongan?.posisi || '-')}</p>
                </div>
              </div>
            </td>
            <td class="td-hide-sm" style="color:var(--muted);font-size:.8rem;">${formatTanggal(item.created_at)}</td>
            <td><span class="badge ${s.cls}">${s.label}</span></td>
          </tr>`
      }).join('')
    : `<tr><td colspan="3" style="text-align:center;padding:3rem;color:var(--light);font-size:.875rem;">Belum ada lamaran masuk</td></tr>`

  document.getElementById('lamaranTerbaru').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Pelamar</th>
          <th class="td-hide-sm">Tanggal</th>
          <th>Status</th>
        </tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`
}

document.addEventListener('DOMContentLoaded', async () => {
  const session = await checkAuth()
  if (!session) return
  initSidebar('dashboard.html')
  initAdminHeader()
  loadDashboard()
})
</script>
</body>
</html>
