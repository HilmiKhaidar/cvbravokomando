<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Lowongan — Admin Bravo Komando</title>
  <link rel="icon" href="../images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
<div class="admin-wrap">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../images/bkGroup.png" alt="BK Group" width="36" height="36" />
      <div><p class="sidebar-logo-title">BRAVO KOMANDO</p><p class="sidebar-logo-sub">Admin Panel</p></div>
    </div>
    <div id="sidebar"></div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h1>Kelola Lowongan</h1>
      <div class="admin-header-right" id="adminHeaderRight"></div>
    </header>
    <div class="page-body">
      <div class="page-toolbar">
        <p class="page-count" id="pageCount">Memuat...</p>
        <button class="btn btn-primary" onclick="openAdd()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Lowongan
        </button>
      </div>
      <div class="card" id="tableWrap">
        <div class="loading-center"><div class="spinner-lg spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal modal-lg" id="modalBox">
    <div class="modal-header">
      <h2 id="modalTitle">Tambah Lowongan</h2>
      <button class="btn-icon" onclick="closeModal('modalOverlay')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="lowonganForm" onsubmit="handleSave(event)">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Posisi *</label>
          <input type="text" id="fPosisi" class="form-input" placeholder="Nama posisi" required />
        </div>
        <div class="form-group">
          <label class="form-label">Departemen</label>
          <input type="text" id="fDepartemen" class="form-input" placeholder="Nama departemen" />
        </div>
        <div class="form-group">
          <label class="form-label">Lokasi</label>
          <input type="text" id="fLokasi" class="form-input" placeholder="Kota, Provinsi" />
        </div>
        <div class="form-group">
          <label class="form-label">Tipe</label>
          <select id="fTipe" class="form-select">
            <option>Full Time</option><option>Part Time</option>
            <option>Contract</option><option>Magang</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="fStatus" class="form-select">
            <option value="aktif">Aktif</option>
            <option value="tutup">Tutup</option>
            <option value="draft">Draft</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Deadline</label>
          <input type="date" id="fDeadline" class="form-input" />
        </div>
        <div class="form-group col-span-2">
          <label class="form-label">Deskripsi Pekerjaan</label>
          <textarea id="fDeskripsi" class="form-textarea" rows="3" placeholder="Deskripsi tugas dan tanggung jawab..."></textarea>
        </div>
        <div class="form-group col-span-2">
          <label class="form-label">Kualifikasi</label>
          <textarea id="fKualifikasi" class="form-textarea" rows="3" placeholder="Syarat dan kualifikasi pelamar..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modalOverlay')">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
<script>
let editId = null

async function fetchLowongan() {
  const { data } = await sb.from('lowongan').select('*').order('created_at', { ascending: false })
  renderTable(data || [])
}

function renderTable(rows) {
  document.getElementById('pageCount').textContent = `${rows.length} lowongan terdaftar`
  if (rows.length === 0) {
    document.getElementById('tableWrap').innerHTML = `
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        <p>Belum ada lowongan. Buat lowongan pertama!</p>
      </div>`
    return
  }
  document.getElementById('tableWrap').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Posisi</th>
          <th class="td-hide-sm">Lokasi</th>
          <th class="td-hide-md">Deadline</th>
          <th>Status</th>
          <th style="text-align:right">Aksi</th>
        </tr></thead>
        <tbody>
          ${rows.map(row => {
            const s = STATUS_LOWONGAN[row.status] || { label: row.status, cls: 'badge-gray' }
            return `
              <tr>
                <td>
                  <p style="font-weight:700;color:var(--text);font-size:.875rem;">${esc(row.posisi)}</p>
                  <p style="font-size:.75rem;color:var(--light);">${esc(row.departemen || 'Umum')}</p>
                </td>
                <td class="td-hide-sm" style="color:var(--muted);font-size:.875rem;">
                  <span style="display:flex;align-items:center;gap:.3rem;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    ${esc(row.lokasi || '-')}
                  </span>
                </td>
                <td class="td-hide-md" style="color:var(--muted);font-size:.875rem;">${formatTanggal(row.deadline)}</td>
                <td>
                  <button onclick="toggleStatus('${row.id}','${row.status}')" class="badge ${s.cls}" style="cursor:pointer;border:none;">
                    ${s.label}
                  </button>
                </td>
                <td style="text-align:right;">
                  <div style="display:flex;justify-content:flex-end;gap:.25rem;">
                    <button class="btn-icon" onclick='openEdit(${JSON.stringify(row)})' title="Edit">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="btn-icon danger" onclick="handleDelete('${row.id}')" title="Hapus">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    </button>
                  </div>
                </td>
              </tr>`
          }).join('')}
        </tbody>
      </table>
    </div>`
}

function openAdd() {
  editId = null
  document.getElementById('modalTitle').textContent = 'Tambah Lowongan'
  document.getElementById('lowonganForm').reset()
  document.getElementById('fStatus').value = 'aktif'
  document.getElementById('fTipe').value = 'Full Time'
  openModal('modalOverlay')
}

function openEdit(row) {
  editId = row.id
  document.getElementById('modalTitle').textContent = 'Edit Lowongan'
  document.getElementById('fPosisi').value     = row.posisi || ''
  document.getElementById('fDepartemen').value = row.departemen || ''
  document.getElementById('fLokasi').value     = row.lokasi || ''
  document.getElementById('fTipe').value       = row.tipe || 'Full Time'
  document.getElementById('fStatus').value     = row.status || 'aktif'
  document.getElementById('fDeadline').value   = row.deadline || ''
  document.getElementById('fDeskripsi').value  = row.deskripsi || ''
  document.getElementById('fKualifikasi').value = row.kualifikasi || ''
  openModal('modalOverlay')
}

async function handleSave(e) {
  e.preventDefault()
  const btn = document.getElementById('saveBtn')
  btn.disabled = true; btn.textContent = 'Menyimpan...'

  const payload = {
    posisi:      document.getElementById('fPosisi').value,
    departemen:  document.getElementById('fDepartemen').value,
    lokasi:      document.getElementById('fLokasi').value,
    tipe:        document.getElementById('fTipe').value,
    status:      document.getElementById('fStatus').value,
    deadline:    document.getElementById('fDeadline').value || null,
    deskripsi:   document.getElementById('fDeskripsi').value,
    kualifikasi: document.getElementById('fKualifikasi').value,
  }

  const { error } = editId
    ? await sb.from('lowongan').update(payload).eq('id', editId)
    : await sb.from('lowongan').insert(payload)

  btn.disabled = false; btn.textContent = 'Simpan'
  if (error) { showToast('Gagal menyimpan: ' + error.message, 'error'); return }
  showToast(editId ? 'Lowongan diperbarui' : 'Lowongan ditambahkan')
  closeModal('modalOverlay')
  fetchLowongan()
}

async function handleDelete(id) {
  if (!confirmDel('Hapus lowongan ini? Semua lamaran terkait juga akan terhapus.')) return
  await sb.from('lamaran').delete().eq('lowongan_id', id)
  const { error } = await sb.from('lowongan').delete().eq('id', id)
  if (error) { showToast('Gagal menghapus', 'error'); return }
  showToast('Lowongan dihapus')
  fetchLowongan()
}

async function toggleStatus(id, current) {
  const next = current === 'aktif' ? 'tutup' : 'aktif'
  await sb.from('lowongan').update({ status: next }).eq('id', id)
  fetchLowongan()
}

function handleOverlayClick(e) {
  if (e.target.id === 'modalOverlay') closeModal('modalOverlay')
}

document.addEventListener('DOMContentLoaded', async () => {
  const session = await checkAuth()
  if (!session) return
  initSidebar('lowongan.html')
  initAdminHeader()
  fetchLowongan()
})
</script>
</body>
</html>
