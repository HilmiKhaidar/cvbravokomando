<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Tim — Admin Bravo Komando</title>
  <link rel="icon" href="../images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    .tim-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 1.25rem;
    }
    @media(max-width:1100px){ .tim-grid{ grid-template-columns:repeat(2,1fr); } }
    @media(max-width:600px) { .tim-grid{ grid-template-columns:1fr; } }

    .tim-card-admin {
      background:#fff; border-radius:1rem; overflow:hidden;
      border:1px solid var(--border); box-shadow:var(--shadow-sm);
      transition:box-shadow .2s, border-color .2s; position:relative;
    }
    .tim-card-admin.inactive { opacity:.55; }
    .tim-card-photo {
      height:18rem; position:relative; overflow:hidden;
      background:linear-gradient(135deg,#0ea5e9,#1e40af);
      display:flex; align-items:center; justify-content:center;
    }
    .tim-card-photo img { width:100%;height:100%;object-fit:cover;object-position:center top; }
    .tim-card-overlay {
      position:absolute;inset:0;background:rgba(0,0,0,.45);
      opacity:0;transition:opacity .2s;
      display:flex;align-items:center;justify-content:center;gap:.5rem;
    }
    .tim-card-admin:hover .tim-card-overlay { opacity:1; }
    .tim-card-overlay-btn {
      width:2rem;height:2rem;background:#fff;border-radius:.5rem;
      display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;
      transition:background .15s,color .15s;
    }
    .tim-card-overlay-btn:hover        { background:#0ea5e9;color:#fff; }
    .tim-card-overlay-btn.danger:hover { background:#ef4444;color:#fff; }
    .tim-card-body { padding:1rem;text-align:center; }
    .tim-card-name { font-weight:800;font-size:.875rem;color:var(--text);margin-bottom:.4rem; }
    .tim-card-jabatan {
      display:inline-block;background:rgba(14,165,233,.1);color:#0ea5e9;
      font-size:.75rem;font-weight:600;padding:.2rem .7rem;border-radius:99px;margin-bottom:.6rem;
    }
    .tim-card-aktif-btn {
      font-size:.75rem;font-weight:700;padding:.2rem .75rem;border-radius:99px;
      border:none;cursor:pointer;transition:all .15s;
    }

    /* Preview foto di modal */
    .foto-preview-wrap {
      width:7rem;height:7rem;border-radius:.75rem;overflow:hidden;flex-shrink:0;
      background:linear-gradient(135deg,#0ea5e9,#1e40af);
      display:flex;align-items:center;justify-content:center;position:relative;
    }
    .foto-preview-wrap img { width:100%;height:100%;object-fit:cover;object-position:center top; }
    .foto-preview-init { color:#fff;font-weight:900;font-size:1.75rem; }

    /* ── Foto Position Adjuster — Modern ── */
    .pos-adjuster {
      display:none; margin-top:1rem;
      background:#f8fafc; border:1px solid var(--border);
      border-radius:.875rem; overflow:hidden;
    }
    .pos-adjuster.visible { display:block; }

    .pos-adjuster-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:.65rem 1rem; border-bottom:1px solid var(--border);
      background:#fff;
    }
    .pos-adjuster-title {
      font-size:.72rem; font-weight:700; color:var(--text);
      text-transform:uppercase; letter-spacing:.06em;
      display:flex; align-items:center; gap:.4rem;
    }
    .pos-adjuster-title svg { color:#0ea5e9; }
    .pos-badge {
      font-size:.65rem; font-weight:700; font-family:monospace;
      background:#eff6ff; color:#0ea5e9; border:1px solid #bae6fd;
      padding:.15rem .5rem; border-radius:99px; letter-spacing:.02em;
    }

    /* Focal drag area */
    .focal-wrap {
      position:relative; width:100%; height:11rem;
      cursor:crosshair; background:#e2e8f0; overflow:hidden;
      user-select:none;
    }
    .focal-wrap img {
      width:100%; height:100%; object-fit:cover; display:block;
      pointer-events:none;
    }
    /* Crosshair overlay */
    .focal-crosshair-h {
      position:absolute; left:0; right:0; height:1px;
      background:rgba(255,255,255,.4); pointer-events:none;
      transform:translateY(-50%); transition:top .08s;
    }
    .focal-crosshair-v {
      position:absolute; top:0; bottom:0; width:1px;
      background:rgba(255,255,255,.4); pointer-events:none;
      transform:translateX(-50%); transition:left .08s;
    }
    .focal-dot {
      position:absolute; width:1.1rem; height:1.1rem;
      background:#fff; border:2.5px solid #0ea5e9; border-radius:50%;
      transform:translate(-50%,-50%); pointer-events:none;
      box-shadow:0 0 0 4px rgba(14,165,233,.2), 0 2px 8px rgba(0,0,0,.25);
      transition:left .08s, top .08s;
    }
    .focal-hint-overlay {
      position:absolute; bottom:.5rem; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,.55); color:#fff; font-size:.65rem; font-weight:500;
      padding:.2rem .6rem; border-radius:99px; pointer-events:none;
      white-space:nowrap; backdrop-filter:blur(4px);
    }

    /* Preset grid */
    .pos-presets-wrap {
      padding:.6rem .75rem .75rem;
    }
    .pos-presets-label {
      font-size:.65rem; font-weight:600; color:var(--muted);
      text-transform:uppercase; letter-spacing:.06em;
      margin-bottom:.45rem;
    }
    .pos-presets {
      display:grid; grid-template-columns:repeat(3,1fr); gap:.3rem;
    }
    .pos-preset-btn {
      display:flex; align-items:center; justify-content:center; gap:.3rem;
      padding:.35rem .3rem; font-size:.68rem; font-weight:600;
      border-radius:.45rem; border:1.5px solid var(--border);
      background:#fff; cursor:pointer; color:#64748b;
      transition:all .15s; white-space:nowrap;
    }
    .pos-preset-btn:hover {
      border-color:#0ea5e9; color:#0ea5e9;
      background:#f0f9ff;
    }
    .pos-preset-btn.active {
      border-color:#0ea5e9; background:#eff6ff;
      color:#0284c7; font-weight:700;
      box-shadow:0 0 0 3px rgba(14,165,233,.12);
    }
    .pos-preset-btn .preset-arrow {
      font-size:.75rem; line-height:1;
    }
  </style>
</head>
<body>
<div class="admin-wrap">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../images/bkGroup.png" alt="BK Group" width="36" height="36" />
      <div><p class="sidebar-logo-title">BRAVO KOMANDO</p><p class="sidebar-logo-sub">Admin Panel</p></div>
    </div>
    <div id="sidebar"></div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <h1>Kelola Tim</h1>
      <div class="admin-header-right" id="adminHeaderRight"></div>
    </header>
    <div class="page-body">
      <div class="page-toolbar">
        <p class="page-count" id="pageCount">Memuat...</p>
        <button class="btn btn-primary" onclick="openAdd()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Anggota
        </button>
      </div>
      <div class="tim-grid" id="timGrid">
        <div class="skeleton" style="height:14rem;border-radius:1rem;"></div>
        <div class="skeleton" style="height:14rem;border-radius:1rem;"></div>
        <div class="skeleton" style="height:14rem;border-radius:1rem;"></div>
        <div class="skeleton" style="height:14rem;border-radius:1rem;"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target.id==='modalOverlay')closeModal('modalOverlay')">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Tambah Anggota</h2>
      <button class="btn-icon" onclick="closeModal('modalOverlay')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form onsubmit="handleSave(event)" style="display:flex;flex-direction:column;gap:1rem;">

      <!-- Upload foto -->
      <div class="form-group">
        <label class="form-label">Foto</label>
        <div style="display:flex;align-items:center;gap:1rem;">
          <div class="foto-preview-wrap" id="fotoPreviewWrap">
            <img id="fotoPreviewImg" src="" alt="" style="display:none;" />
            <span class="foto-preview-init" id="fotoPreviewInit">?</span>
          </div>
          <div style="flex:1;">
            <label class="upload-box" id="uploadBox">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
              <span id="uploadText">Klik untuk upload foto</span>
              <input type="file" id="fotoFile" accept="image/*" onchange="handleFileChange(this)" />
            </label>
            <button type="button" id="removePhotoBtn" class="hidden"
              onclick="removePhoto()"
              style="font-size:.75rem;color:#ef4444;margin-top:.3rem;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.25rem;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Hapus foto baru
            </button>
            <p style="font-size:.75rem;color:var(--light);margin-top:.25rem;">JPG, PNG. Maks 2MB.</p>
          </div>
        </div>

        <!-- ── Position Adjuster (muncul kalau ada foto) ── -->
        <div class="pos-adjuster" id="posAdjuster">
          <div class="pos-adjuster-header">
            <span class="pos-adjuster-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
              Atur Posisi Foto
            </span>
            <span class="pos-badge" id="posValueDisplay">center center</span>
          </div>

          <!-- Drag focal point -->
          <div class="focal-wrap" id="focalWrap">
            <img id="focalImg" src="" alt="" />
            <div class="focal-crosshair-h" id="crosshairH"></div>
            <div class="focal-crosshair-v" id="crosshairV"></div>
            <div class="focal-dot" id="focalDot"></div>
            <div class="focal-hint-overlay">Klik atau drag untuk ubah fokus</div>
          </div>

          <!-- Preset buttons -->
          <div class="pos-presets-wrap">
            <p class="pos-presets-label">Preset cepat</p>
            <div class="pos-presets">
              <button type="button" class="pos-preset-btn" onclick="setPreset('left top')">
                <span class="preset-arrow">↖</span> Kiri Atas
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('center top')">
                <span class="preset-arrow">↑</span> Atas
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('right top')">
                <span class="preset-arrow">↗</span> Kanan Atas
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('left center')">
                <span class="preset-arrow">←</span> Kiri
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('center center')">
                <span class="preset-arrow">⊙</span> Tengah
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('right center')">
                <span class="preset-arrow">→</span> Kanan
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('left bottom')">
                <span class="preset-arrow">↙</span> Kiri Bawah
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('center bottom')">
                <span class="preset-arrow">↓</span> Bawah
              </button>
              <button type="button" class="pos-preset-btn" onclick="setPreset('right bottom')">
                <span class="preset-arrow">↘</span> Kanan Bawah
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group" style="grid-column:span 2">
          <label class="form-label">Nama Lengkap *</label>
          <input type="text" id="fNama" class="form-input" placeholder="Nama anggota" required
            oninput="syncInitial()" />
        </div>
        <div class="form-group">
          <label class="form-label">Inisial</label>
          <input type="text" id="fInisial" class="form-input" maxlength="3"
            placeholder="AB" style="text-align:center;font-weight:800;letter-spacing:.1em;"
            oninput="this.value=this.value.toUpperCase();updatePreviewInit()" />
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group" style="grid-column:span 2">
          <label class="form-label">Jabatan *</label>
          <input type="text" id="fJabatan" class="form-input" placeholder="Jabatan" required />
        </div>
        <div class="form-group">
          <label class="form-label">Urutan</label>
          <input type="number" id="fUrutan" class="form-input" value="0" min="0" />
        </div>
      </div>

      <div class="form-checkbox">
        <input type="checkbox" id="fAktif" checked />
        <label for="fAktif">Tampilkan di website</label>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modalOverlay')">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
<script>
const GRADIENTS = [
  'linear-gradient(135deg,#0ea5e9,#1e40af)',
  'linear-gradient(135deg,#dc2626,#9f1239)',
  'linear-gradient(135deg,#0ea5e9,#0284c7)',
  'linear-gradient(135deg,#1e40af,#1e3a8a)',
  'linear-gradient(135deg,#0ea5e9,#1e293b)',
  'linear-gradient(135deg,#dc2626,#1e293b)',
]

let editId        = null
let currentFotoUrl = null
let newFotoFile    = null
let currentPosition = 'center center'

/* ═══════════════════════════════
   FETCH & RENDER
═══════════════════════════════ */
async function fetchTim() {
  const { data } = await sb.from('tim').select('*').order('urutan', { ascending: true })
  renderGrid(data || [])
}

function renderGrid(rows) {
  document.getElementById('pageCount').textContent = `${rows.length} anggota tim`
  if (rows.length === 0) {
    document.getElementById('timGrid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <p>Belum ada anggota tim.</p>
      </div>`
    return
  }
  document.getElementById('timGrid').innerHTML = rows.map((m, i) => {
    const grad    = GRADIENTS[i % GRADIENTS.length]
    const initial = (m.inisial || m.nama?.charAt(0) || '?').toUpperCase()
    const pos     = m.foto_position || 'center center'
    const photoHtml = m.foto_url
      ? `<img src="${esc(m.foto_url)}" alt="${esc(m.nama)}" style="object-position:${esc(pos)}" />`
      : `<span style="color:#fff;font-weight:900;font-size:1.75rem;">${esc(initial)}</span>`
    const aktifCls = m.aktif ? 'background:#dcfce7;color:#15803d;' : 'background:#f1f5f9;color:#64748b;'
    return `
      <div class="tim-card-admin ${m.aktif ? '' : 'inactive'}">
        <div class="tim-card-photo" style="background:${grad};">
          ${photoHtml}
          <div class="tim-card-overlay">
            <button class="tim-card-overlay-btn" onclick='openEdit(${JSON.stringify(m)})' title="Edit">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="tim-card-overlay-btn danger" onclick='handleDelete(${JSON.stringify(m)})' title="Hapus">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
          </div>
        </div>
        <div class="tim-card-body">
          <p class="tim-card-name">${esc(m.nama)}</p>
          <span class="tim-card-jabatan">${esc(m.jabatan)}</span><br/>
          <button class="tim-card-aktif-btn" style="${aktifCls}" onclick="toggleAktif('${m.id}',${m.aktif})">
            ${m.aktif ? 'Aktif' : 'Non-aktif'}
          </button>
        </div>
      </div>`
  }).join('')
}

/* ═══════════════════════════════
   POSITION ADJUSTER
═══════════════════════════════ */
function showAdjuster(src) {
  const adj   = document.getElementById('posAdjuster')
  const fImg  = document.getElementById('focalImg')
  const pImg  = document.getElementById('fotoPreviewImg')
  adj.classList.add('visible')
  fImg.src = src
  // sync dot & preview position
  applyPosition(currentPosition)
}

function hideAdjuster() {
  document.getElementById('posAdjuster').classList.remove('visible')
}

function setPreset(pos) {
  currentPosition = pos
  applyPosition(pos)
}

function applyPosition(pos) {
  currentPosition = pos

  // Update focal image object-position
  const fImg = document.getElementById('focalImg')
  fImg.style.objectPosition = pos

  // Update preview thumbnail
  const pImg = document.getElementById('fotoPreviewImg')
  if (pImg) pImg.style.objectPosition = pos

  // Parse x/y percentage
  const parts = pos.split(' ')
  const xWord = parts[0]
  const yWord = parts[1] || 'center'
  const xMap  = { left: 10, center: 50, right: 90 }
  const yMap  = { top: 10, center: 50, bottom: 90 }
  const xPct  = xMap[xWord]  ?? parseFloat(xWord)  ?? 50
  const yPct  = yMap[yWord]  ?? parseFloat(yWord)  ?? 50

  // Update dot
  const dot = document.getElementById('focalDot')
  dot.style.left = `${xPct}%`
  dot.style.top  = `${yPct}%`

  // Update crosshairs
  const ch = document.getElementById('crosshairH')
  const cv = document.getElementById('crosshairV')
  if (ch) ch.style.top  = `${yPct}%`
  if (cv) cv.style.left = `${xPct}%`

  // Update badge
  document.getElementById('posValueDisplay').textContent = pos

  // Highlight active preset
  document.querySelectorAll('.pos-preset-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick') === `setPreset('${pos}')`)
  })
}

// Setup drag on focal area
function initFocalDrag() {
  const wrap = document.getElementById('focalWrap')
  let dragging = false

  function onMove(e) {
    const rect = wrap.getBoundingClientRect()
    const clientX = e.touches ? e.touches[0].clientX : e.clientX
    const clientY = e.touches ? e.touches[0].clientY : e.clientY
    const xPct = Math.round(Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width)  * 100)))
    const yPct = Math.round(Math.max(0, Math.min(100, ((clientY - rect.top)  / rect.height) * 100)))
    applyPosition(`${xPct}% ${yPct}%`)
  }

  wrap.addEventListener('mousedown',  e => { dragging = true; onMove(e) })
  wrap.addEventListener('touchstart', e => { dragging = true; onMove(e) }, { passive: true })
  wrap.addEventListener('mousemove',  e => { if (dragging) onMove(e) })
  wrap.addEventListener('touchmove',  e => { if (dragging) onMove(e) }, { passive: true })
  window.addEventListener('mouseup',  () => dragging = false)
  window.addEventListener('touchend', () => dragging = false)
}

/* ═══════════════════════════════
   MODAL HELPERS
═══════════════════════════════ */
function syncInitial() {
  const nm = document.getElementById('fNama').value
  if (!document.getElementById('fInisial').value) {
    document.getElementById('fotoPreviewInit').textContent = nm.charAt(0).toUpperCase() || '?'
  }
}
function updatePreviewInit() {
  const ini = document.getElementById('fInisial').value || document.getElementById('fNama').value.charAt(0)
  document.getElementById('fotoPreviewInit').textContent = ini.toUpperCase() || '?'
}

function handleFileChange(input) {
  const file = input.files[0]; if (!file) return
  newFotoFile = file
  document.getElementById('uploadText').textContent = file.name
  document.getElementById('removePhotoBtn').classList.remove('hidden')
  const reader = new FileReader()
  reader.onload = e => {
    const img = document.getElementById('fotoPreviewImg')
    img.src = e.target.result
    img.style.display = 'block'
    img.style.objectPosition = currentPosition
    document.getElementById('fotoPreviewInit').style.display = 'none'
    showAdjuster(e.target.result)
  }
  reader.readAsDataURL(file)
}

function removePhoto() {
  newFotoFile = null
  document.getElementById('fotoFile').value = ''
  document.getElementById('uploadText').textContent = 'Klik untuk upload foto'
  document.getElementById('removePhotoBtn').classList.add('hidden')
  const img    = document.getElementById('fotoPreviewImg')
  const initEl = document.getElementById('fotoPreviewInit')
  img.src = ''; img.style.display = 'none'
  const ini = document.getElementById('fInisial').value || document.getElementById('fNama').value.charAt(0)
  initEl.textContent = ini.toUpperCase() || '?'; initEl.style.display = ''
  if (currentFotoUrl) {
    img.src = currentFotoUrl; img.style.display = 'block'; initEl.style.display = 'none'
    showAdjuster(currentFotoUrl)
  } else {
    hideAdjuster()
  }
}

function resetModal() {
  newFotoFile = null; currentFotoUrl = null; currentPosition = 'center center'
  document.getElementById('fotoFile').value = ''
  document.getElementById('uploadText').textContent = 'Klik untuk upload foto'
  document.getElementById('removePhotoBtn').classList.add('hidden')
  const img = document.getElementById('fotoPreviewImg')
  img.src = ''; img.style.display = 'none'
  const initEl = document.getElementById('fotoPreviewInit')
  initEl.textContent = '?'; initEl.style.display = ''
  hideAdjuster()
}

function openAdd() {
  editId = null
  document.getElementById('modalTitle').textContent = 'Tambah Anggota'
  document.getElementById('fNama').value    = ''
  document.getElementById('fInisial').value = ''
  document.getElementById('fJabatan').value = ''
  document.getElementById('fUrutan').value  = 0
  document.getElementById('fAktif').checked = true
  resetModal()
  openModal('modalOverlay')
}

function openEdit(m) {
  editId = m.id
  document.getElementById('modalTitle').textContent = 'Edit Anggota'
  document.getElementById('fNama').value    = m.nama    || ''
  document.getElementById('fInisial').value = m.inisial || ''
  document.getElementById('fJabatan').value = m.jabatan || ''
  document.getElementById('fUrutan').value  = m.urutan  || 0
  document.getElementById('fAktif').checked = !!m.aktif
  // reset dulu, baru set state foto — urutan ini penting!
  resetModal()
  currentFotoUrl  = m.foto_url      || null
  currentPosition = m.foto_position || 'center center'
  if (m.foto_url) {
    const img = document.getElementById('fotoPreviewImg')
    img.src = m.foto_url
    img.style.display = 'block'
    img.style.objectPosition = currentPosition
    document.getElementById('fotoPreviewInit').style.display = 'none'
    showAdjuster(m.foto_url)
  } else {
    const ini = m.inisial || m.nama?.charAt(0) || '?'
    document.getElementById('fotoPreviewInit').textContent = ini.toUpperCase()
  }
  openModal('modalOverlay')
}

/* ═══════════════════════════════
   SAVE
═══════════════════════════════ */
async function handleSave(e) {
  e.preventDefault()
  const btn = document.getElementById('saveBtn')
  btn.disabled = true; btn.textContent = 'Menyimpan...'

  try {
    let foto_url = currentFotoUrl

    if (newFotoFile) {
      const ext      = newFotoFile.name.split('.').pop()
      const fileName = `tim_${Date.now()}.${ext}`
      const { error: upErr } = await sb.storage.from('foto-tim').upload(fileName, newFotoFile, { upsert: true })
      if (upErr) throw upErr
      const { data: urlData } = sb.storage.from('foto-tim').getPublicUrl(fileName)
      foto_url = urlData.publicUrl
    }

    const payload = {
      nama:          document.getElementById('fNama').value,
      inisial:       document.getElementById('fInisial').value.toUpperCase(),
      jabatan:       document.getElementById('fJabatan').value,
      urutan:        parseInt(document.getElementById('fUrutan').value) || 0,
      aktif:         document.getElementById('fAktif').checked,
      foto_url,
      foto_position: foto_url ? currentPosition : null,
    }

    const { error } = editId
      ? await sb.from('tim').update(payload).eq('id', editId)
      : await sb.from('tim').insert(payload)
    if (error) throw error

    showToast(editId ? 'Anggota diperbarui' : 'Anggota ditambahkan')
    closeModal('modalOverlay')
    fetchTim()
  } catch (err) {
    showToast('Gagal menyimpan: ' + err.message, 'error')
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan'
  }
}

async function handleDelete(m) {
  if (!confirmDel(`Hapus ${m.nama}?`)) return
  if (m.foto_url) {
    const path = m.foto_url.split('/foto-tim/')[1]
    if (path) await sb.storage.from('foto-tim').remove([path])
  }
  const { error } = await sb.from('tim').delete().eq('id', m.id)
  if (error) { showToast('Gagal menghapus', 'error'); return }
  showToast('Anggota dihapus')
  fetchTim()
}

async function toggleAktif(id, current) {
  await sb.from('tim').update({ aktif: !current }).eq('id', id)
  fetchTim()
}

document.addEventListener('DOMContentLoaded', async () => {
  const session = await checkAuth()
  if (!session) return
  initSidebar('tim.html')
  initAdminHeader()
  initFocalDrag()
  fetchTim()
})
</script>
