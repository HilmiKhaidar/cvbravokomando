<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Tim — Admin Bravo Komando</title>
  <link rel="icon" href="../images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    .tim-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 1.25rem;
    }
    @media(max-width:1100px){ .tim-grid{ grid-template-columns:repeat(2,1fr); } }
    @media(max-width:600px) { .tim-grid{ grid-template-columns:1fr; } }

    .tim-card-admin {
      background:#fff; border-radius:1rem; overflow:hidden;
      border:1px solid var(--border); box-shadow:var(--shadow-sm);
      transition:box-shadow .2s, border-color .2s; position:relative;
    }
    .tim-card-admin.inactive { opacity:.55; }
    .tim-card-photo {
      height:18rem; position:relative; overflow:hidden;
      background:linear-gradient(135deg,#0ea5e9,#1e40af);
      display:flex; align-items:center; justify-content:center;
    }
    .tim-card-photo img { width:100%;height:100%;object-fit:cover;object-position:center top; }
    .tim-card-overlay {
      position:absolute;inset:0;background:rgba(0,0,0,.45);
      opacity:0;transition:opacity .2s;
      display:flex;align-items:center;justify-content:center;gap:.5rem;
    }
    .tim-card-admin:hover .tim-card-overlay { opacity:1; }
    .tim-card-overlay-btn {
      width:2rem;height:2rem;background:#fff;border-radius:.5rem;
      display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;
      transition:background .15s,color .15s;
    }
    .tim-card-overlay-btn:hover        { background:#0ea5e9;color:#fff; }
    .tim-card-overlay-btn.danger:hover { background:#ef4444;color:#fff; }
    .tim-card-body { padding:1rem;text-align:center; }
    .tim-card-name { font-weight:800;font-size:.875rem;color:var(--text);margin-bottom:.4rem; }
    .tim-card-jabatan {
      display:inline-block;background:rgba(14,165,233,.1);color:#0ea5e9;
      font-size:.75rem;font-weight:600;padding:.2rem .7rem;border-radius:99px;margin-bottom:.6rem;
    }
    .tim-card-aktif-btn {
      font-size:.75rem;font-weight:700;padding:.2rem .75rem;border-radius:99px;
      border:none;cursor:pointer;transition:all .15s;
    }
    .foto-preview-wrap {
      width:7rem;height:7rem;border-radius:.75rem;overflow:hidden;flex-shrink:0;
      background:linear-gradient(135deg,#0ea5e9,#1e40af);
      display:flex;align-items:center;justify-content:center;position:relative;
    }
    .foto-preview-wrap img { width:100%;height:100%;object-fit:cover; }
    .foto-preview-init { color:#fff;font-weight:900;font-size:1.75rem; }

    /* ── Crop Modal ── */
    .crop-modal-overlay {
      position:fixed;inset:0;z-index:300;
      background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
      display:flex;align-items:center;justify-content:center;padding:1rem;
    }
    .crop-modal {
      background:#fff;border-radius:1.25rem;
      width:100%;max-width:560px;overflow:hidden;
      box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
      display:flex;flex-direction:column;max-height:90vh;
    }
    .crop-modal-header {
      display:flex;align-items:center;justify-content:space-between;
      padding:1rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0;
    }
    .crop-modal-header h3 { font-weight:800;font-size:.95rem;color:var(--text); }
    .crop-modal-body {
      background:#1e293b;flex:1;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      min-height:300px;max-height:420px;
    }
    .crop-modal-body img { max-width:100%;max-height:100%;display:block; }
    .crop-modal-toolbar {
      padding:.75rem 1.25rem;border-top:1px solid var(--border);
      display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;flex-shrink:0;
      background:#f8fafc;
    }
    .crop-tool-btn {
      display:flex;align-items:center;justify-content:center;
      width:2.25rem;height:2.25rem;border-radius:.5rem;border:1.5px solid var(--border);
      background:#fff;cursor:pointer;color:#475569;transition:all .15s;flex-shrink:0;
    }
    .crop-tool-btn:hover { border-color:#0ea5e9;color:#0ea5e9;background:#f0f9ff; }
    .crop-tool-sep { width:1px;height:1.5rem;background:var(--border);flex-shrink:0; }
    .crop-ratio-btn {
      padding:.3rem .65rem;border-radius:.45rem;border:1.5px solid var(--border);
      background:#fff;cursor:pointer;font-size:.72rem;font-weight:700;color:#475569;
      transition:all .15s;flex-shrink:0;
    }
    .crop-ratio-btn:hover  { border-color:#0ea5e9;color:#0ea5e9;background:#f0f9ff; }
    .crop-ratio-btn.active { border-color:#0ea5e9;background:#eff6ff;color:#0284c7; }
    .crop-modal-footer {
      padding:.75rem 1.25rem;border-top:1px solid var(--border);
      display:flex;justify-content:flex-end;gap:.5rem;flex-shrink:0;background:#fff;
    }
    .crop-hint {
      flex:1;font-size:.72rem;color:#94a3b8;display:flex;align-items:center;gap:.35rem;
    }
  </style>
</head>
<body>
<div class="admin-wrap">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../images/bkGroup.png" alt="BK Group" width="36" height="36" />
      <div><p class="sidebar-logo-title">BRAVO KOMANDO</p><p class="sidebar-logo-sub">Admin Panel</p></div>
    </div>
    <div id="sidebar"></div>
  </aside>
  <div class="admin-main">
    <header class="admin-header">
      <h1>Kelola Tim</h1>
      <div class="admin-header-right" id="adminHeaderRight"></div>
    </header>
    <div class="page-body">
      <div class="page-toolbar">
        <p class="page-count" id="pageCount">Memuat...</p>
        <button class="btn btn-primary" onclick="openAdd()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Tambah Anggota
        </button>
      </div>
      <div class="tim-grid" id="timGrid">
        <div class="skeleton" style="height:20rem;border-radius:1rem;"></div>
        <div class="skeleton" style="height:20rem;border-radius:1rem;"></div>
        <div class="skeleton" style="height:20rem;border-radius:1rem;"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ CROP MODAL ═══ -->
<div class="crop-modal-overlay hidden" id="cropModalOverlay">
  <div class="crop-modal">
    <div class="crop-modal-header">
      <h3>Crop Foto</h3>
      <button class="btn-icon" onclick="closeCropModal()" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="crop-modal-body">
      <img id="cropImage" src="" alt="crop" />
    </div>
    <div class="crop-modal-toolbar">
      <span class="crop-hint">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Drag, scroll zoom, atau putar
      </span>
      <!-- Rotate -->
      <button class="crop-tool-btn" onclick="cropperRotate(-90)" title="Putar kiri" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      </button>
      <button class="crop-tool-btn" onclick="cropperRotate(90)" title="Putar kanan" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.5"/></svg>
      </button>
      <!-- Flip -->
      <button class="crop-tool-btn" onclick="cropperFlipX()" title="Flip horizontal" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
      </button>
      <div class="crop-tool-sep"></div>
      <!-- Ratio -->
      <button class="crop-ratio-btn active" id="ratioFree"  onclick="setCropRatio(NaN)"    type="button">Bebas</button>
      <button class="crop-ratio-btn"        id="ratio11"    onclick="setCropRatio(1)"       type="button">1:1</button>
      <button class="crop-ratio-btn"        id="ratio43"    onclick="setCropRatio(4/3)"     type="button">4:3</button>
      <button class="crop-ratio-btn"        id="ratio34"    onclick="setCropRatio(3/4)"     type="button">3:4</button>
      <button class="crop-ratio-btn"        id="ratio169"   onclick="setCropRatio(16/9)"    type="button">16:9</button>
    </div>
    <div class="crop-modal-footer">
      <button class="btn btn-ghost" onclick="closeCropModal()" type="button">Batal</button>
      <button class="btn btn-primary" onclick="applyCrop()" type="button" id="applyCropBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Gunakan Foto
      </button>
    </div>
  </div>
</div>

<!-- ═══ MAIN MODAL ═══ -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target.id==='modalOverlay')closeModal('modalOverlay')">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Tambah Anggota</h2>
      <button class="btn-icon" onclick="closeModal('modalOverlay')" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form onsubmit="handleSave(event)" style="display:flex;flex-direction:column;gap:1rem;">

      <!-- Foto -->
      <div class="form-group">
        <label class="form-label">Foto</label>
        <div style="display:flex;align-items:flex-start;gap:1rem;">
          <!-- Preview -->
          <div class="foto-preview-wrap" id="fotoPreviewWrap">
            <img id="fotoPreviewImg" src="" alt="" style="display:none;" />
            <span class="foto-preview-init" id="fotoPreviewInit">?</span>
          </div>
          <div style="flex:1;">
            <label class="upload-box" id="uploadBox">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
              <span id="uploadText">Klik untuk upload foto</span>
              <input type="file" id="fotoFile" accept="image/*" onchange="handleFileChange(this)" />
            </label>
            <!-- Edit crop button (muncul kalau sudah ada foto) -->
            <button type="button" id="editCropBtn" class="hidden"
              onclick="reopenCrop()"
              style="font-size:.75rem;color:#0ea5e9;margin-top:.4rem;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.3rem;font-weight:600;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit crop
            </button>
            <button type="button" id="removePhotoBtn" class="hidden"
              onclick="removePhoto()"
              style="font-size:.75rem;color:#ef4444;margin-top:.25rem;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:.25rem;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Hapus foto
            </button>
            <p style="font-size:.72rem;color:var(--light);margin-top:.25rem;">JPG, PNG. Maks 5MB.</p>
          </div>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group" style="grid-column:span 2">
          <label class="form-label">Nama Lengkap *</label>
          <input type="text" id="fNama" class="form-input" placeholder="Nama anggota" required oninput="syncInitial()" />
        </div>
        <div class="form-group">
          <label class="form-label">Inisial</label>
          <input type="text" id="fInisial" class="form-input" maxlength="3" placeholder="AB"
            style="text-align:center;font-weight:800;letter-spacing:.1em;"
            oninput="this.value=this.value.toUpperCase();updatePreviewInit()" />
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group" style="grid-column:span 2">
          <label class="form-label">Jabatan *</label>
          <input type="text" id="fJabatan" class="form-input" placeholder="Jabatan" required />
        </div>
        <div class="form-group">
          <label class="form-label">Urutan</label>
          <input type="number" id="fUrutan" class="form-input" value="0" min="0" />
        </div>
      </div>

      <div class="form-checkbox">
        <input type="checkbox" id="fAktif" checked />
        <label for="fAktif">Tampilkan di website</label>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modalOverlay')">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script src="admin.js"></script>
<script>
const GRADIENTS = [
  'linear-gradient(135deg,#0ea5e9,#1e40af)',
  'linear-gradient(135deg,#dc2626,#9f1239)',
  'linear-gradient(135deg,#0ea5e9,#0284c7)',
  'linear-gradient(135deg,#1e40af,#1e3a8a)',
  'linear-gradient(135deg,#0ea5e9,#1e293b)',
  'linear-gradient(135deg,#dc2626,#1e293b)',
]

let editId         = null
let currentFotoUrl = null   // URL foto existing (dari DB)
let croppedBlob    = null   // Blob hasil crop (foto baru)
let croppedDataUrl = null   // DataURL untuk preview
let rawDataUrl     = null   // DataURL file asli (untuk reopen crop)
let cropperInstance = null

/* ═══════════════════════════════
   FETCH & RENDER
═══════════════════════════════ */
async function fetchTim() {
  const { data } = await sb.from('tim').select('*').order('urutan', { ascending: true })
  renderGrid(data || [])
}

function renderGrid(rows) {
  document.getElementById('pageCount').textContent = `${rows.length} anggota tim`
  if (rows.length === 0) {
    document.getElementById('timGrid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <p>Belum ada anggota tim.</p>
      </div>`
    return
  }
  document.getElementById('timGrid').innerHTML = rows.map((m, i) => {
    const grad    = GRADIENTS[i % GRADIENTS.length]
    const initial = (m.inisial || m.nama?.charAt(0) || '?').toUpperCase()
    const photoHtml = m.foto_url
      ? `<img src="${esc(m.foto_url)}" alt="${esc(m.nama)}" />`
      : `<span style="color:#fff;font-weight:900;font-size:1.75rem;">${esc(initial)}</span>`
    const aktifCls = m.aktif ? 'background:#dcfce7;color:#15803d;' : 'background:#f1f5f9;color:#64748b;'
    return `
      <div class="tim-card-admin ${m.aktif ? '' : 'inactive'}">
        <div class="tim-card-photo" style="background:${grad};">
          ${photoHtml}
          <div class="tim-card-overlay">
            <button class="tim-card-overlay-btn" onclick='openEdit(${JSON.stringify(m)})' title="Edit" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="tim-card-overlay-btn danger" onclick='handleDelete(${JSON.stringify(m)})' title="Hapus" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
          </div>
        </div>
        <div class="tim-card-body">
          <p class="tim-card-name">${esc(m.nama)}</p>
          <span class="tim-card-jabatan">${esc(m.jabatan)}</span><br/>
          <button class="tim-card-aktif-btn" type="button" style="${aktifCls}" onclick="toggleAktif('${m.id}',${m.aktif})">
            ${m.aktif ? 'Aktif' : 'Non-aktif'}
          </button>
        </div>
      </div>`
  }).join('')
}

/* ═══════════════════════════════
   CROPPER HELPERS
═══════════════════════════════ */
function openCropModal(dataUrl) {
  rawDataUrl = dataUrl
  const overlay = document.getElementById('cropModalOverlay')
  const img     = document.getElementById('cropImage')

  // Destroy existing cropper dulu
  if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null }

  overlay.classList.remove('hidden')

  // Reset src dulu supaya onload selalu trigger meski src sama
  img.src = ''
  img.onload = () => {
    cropperInstance = new Cropper(img, {
      aspectRatio: NaN,
      viewMode: 1,
      autoCropArea: 0.85,
      movable: true,
      zoomable: true,
      rotatable: true,
      scalable: true,
      responsive: true,
      background: false,
      guides: true,
      highlight: true,
      cropBoxMovable: true,
      cropBoxResizable: true,
    })
    document.querySelectorAll('.crop-ratio-btn').forEach(b => b.classList.remove('active'))
    document.getElementById('ratioFree').classList.add('active')
  }
  // Set src setelah onload terdaftar
  img.src = dataUrl
}

function closeCropModal() {
  document.getElementById('cropModalOverlay').classList.add('hidden')
  if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null }
  // Kalau cancel dan belum pernah crop dan tidak ada foto existing → reset
  if (!croppedBlob && !currentFotoUrl) {
    resetFotoState()
  }
  // Restore upload text yang benar
  if (!croppedBlob) {
    document.getElementById('uploadText').textContent =
      currentFotoUrl ? 'Ganti foto' : 'Klik untuk upload foto'
  }
}

function reopenCrop() {
  if (rawDataUrl) openCropModal(rawDataUrl)
}

function applyCrop() {
  if (!cropperInstance) return
  const btn = document.getElementById('applyCropBtn')
  btn.disabled = true
  btn.textContent = 'Memproses...'

  const canvas = cropperInstance.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200, imageSmoothingQuality: 'high' })
  canvas.toBlob(blob => {
    croppedBlob    = blob
    croppedDataUrl = canvas.toDataURL('image/jpeg', 0.92)

    // Update preview di modal utama
    const img    = document.getElementById('fotoPreviewImg')
    const initEl = document.getElementById('fotoPreviewInit')
    img.src = croppedDataUrl
    img.style.display = 'block'
    initEl.style.display = 'none'

    document.getElementById('uploadText').textContent = 'Foto sudah di-crop ✓'
    document.getElementById('removePhotoBtn').classList.remove('hidden')
    document.getElementById('editCropBtn').classList.remove('hidden')

    // Tutup crop modal
    document.getElementById('cropModalOverlay').classList.add('hidden')
    if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null }

    btn.disabled = false
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Gunakan Foto`
  }, 'image/jpeg', 0.92)
}

function cropperRotate(deg) { if (cropperInstance) cropperInstance.rotate(deg) }

function cropperFlipX() {
  if (!cropperInstance) return
  const d = cropperInstance.getData()
  cropperInstance.scaleX(d.scaleX === -1 ? 1 : -1)
}

function setCropRatio(ratio) {
  if (cropperInstance) cropperInstance.setAspectRatio(ratio)
  document.querySelectorAll('.crop-ratio-btn').forEach(b => b.classList.remove('active'))
  // Cari button yang sesuai berdasarkan onclick attribute
  const ratioMap = [
    { id: 'ratioFree', val: NaN },
    { id: 'ratio11',   val: 1 },
    { id: 'ratio43',   val: 4/3 },
    { id: 'ratio34',   val: 3/4 },
    { id: 'ratio169',  val: 16/9 },
  ]
  const match = ratioMap.find(r => isNaN(r.val) ? isNaN(ratio) : Math.abs(r.val - ratio) < 0.001)
  if (match) document.getElementById(match.id)?.classList.add('active')
}

/* ═══════════════════════════════
   MODAL HELPERS
═══════════════════════════════ */
function syncInitial() {
  const nm = document.getElementById('fNama').value
  if (!document.getElementById('fInisial').value) {
    document.getElementById('fotoPreviewInit').textContent = nm.charAt(0).toUpperCase() || '?'
  }
}
function updatePreviewInit() {
  const ini = document.getElementById('fInisial').value || document.getElementById('fNama').value.charAt(0)
  document.getElementById('fotoPreviewInit').textContent = ini.toUpperCase() || '?'
}

function resetFotoState() {
  croppedBlob    = null
  croppedDataUrl = null
  rawDataUrl     = null
  document.getElementById('fotoFile').value = ''
  document.getElementById('uploadText').textContent = 'Klik untuk upload foto'
  document.getElementById('removePhotoBtn').classList.add('hidden')
  document.getElementById('editCropBtn').classList.add('hidden')
  const img    = document.getElementById('fotoPreviewImg')
  const initEl = document.getElementById('fotoPreviewInit')
  img.src = ''; img.style.display = 'none'
  // Jangan override inisial jika field belum diisi — cukup tampilkan '?'
  initEl.textContent = '?'; initEl.style.display = ''
}

function handleFileChange(input) {
  const file = input.files[0]; if (!file) return
  // Validasi ukuran maks 5MB
  if (file.size > 5 * 1024 * 1024) {
    showToast('Ukuran file maksimal 5 MB', 'error')
    input.value = ''; return
  }
  const reader = new FileReader()
  reader.onload = e => openCropModal(e.target.result)
  reader.readAsDataURL(file)
}

function removePhoto() {
  resetFotoState()
  currentFotoUrl = null
}

function resetModal() {
  currentFotoUrl = null
  resetFotoState()
}

function openAdd() {
  editId = null
  document.getElementById('modalTitle').textContent = 'Tambah Anggota'
  document.getElementById('fNama').value    = ''
  document.getElementById('fInisial').value = ''
  document.getElementById('fJabatan').value = ''
  document.getElementById('fUrutan').value  = 0
  document.getElementById('fAktif').checked = true
  resetModal()
  openModal('modalOverlay')
}

function openEdit(m) {
  editId = m.id
  document.getElementById('modalTitle').textContent = 'Edit Anggota'
  document.getElementById('fNama').value    = m.nama    || ''
  document.getElementById('fInisial').value = m.inisial || ''
  document.getElementById('fJabatan').value = m.jabatan || ''
  document.getElementById('fUrutan').value  = m.urutan  || 0
  document.getElementById('fAktif').checked = !!m.aktif

  // Reset state foto dulu
  croppedBlob = null; croppedDataUrl = null; rawDataUrl = null
  document.getElementById('fotoFile').value = ''
  document.getElementById('removePhotoBtn').classList.add('hidden')
  document.getElementById('editCropBtn').classList.add('hidden')

  const img    = document.getElementById('fotoPreviewImg')
  const initEl = document.getElementById('fotoPreviewInit')

  if (m.foto_url) {
    // Ada foto existing — tampilkan
    currentFotoUrl = m.foto_url
    img.src = m.foto_url
    img.style.display = 'block'
    initEl.style.display = 'none'
    document.getElementById('uploadText').textContent = 'Ganti foto'
    document.getElementById('removePhotoBtn').classList.remove('hidden')
    // rawDataUrl = null karena foto existing adalah URL, bukan dataURL lokal
    // editCropBtn disembunyikan karena tidak bisa re-crop foto dari URL (cross-origin)
    document.getElementById('editCropBtn').classList.add('hidden')
  } else {
    // Tidak ada foto — tampilkan inisial
    currentFotoUrl = null
    img.src = ''; img.style.display = 'none'
    initEl.textContent = (m.inisial || m.nama?.charAt(0) || '?').toUpperCase()
    initEl.style.display = ''
    document.getElementById('uploadText').textContent = 'Klik untuk upload foto'
  }

  openModal('modalOverlay')
}

/* ═══════════════════════════════
   SAVE
═══════════════════════════════ */
async function handleSave(e) {
  e.preventDefault()
  const btn = document.getElementById('saveBtn')
  btn.disabled = true; btn.textContent = 'Menyimpan...'

  try {
    let foto_url = currentFotoUrl

    // Upload hasil crop (blob) ke Supabase Storage
    if (croppedBlob) {
      const fileName = `tim_${Date.now()}.jpg`
      const { error: upErr } = await sb.storage.from('foto-tim').upload(fileName, croppedBlob, {
        contentType: 'image/jpeg', upsert: true
      })
      if (upErr) throw upErr
      const { data: urlData } = sb.storage.from('foto-tim').getPublicUrl(fileName)
      foto_url = urlData.publicUrl
    }

    const payload = {
      nama:    document.getElementById('fNama').value,
      inisial: document.getElementById('fInisial').value.toUpperCase(),
      jabatan: document.getElementById('fJabatan').value,
      urutan:  parseInt(document.getElementById('fUrutan').value) || 0,
      aktif:   document.getElementById('fAktif').checked,
      foto_url,
    }

    const { error } = editId
      ? await sb.from('tim').update(payload).eq('id', editId)
      : await sb.from('tim').insert(payload)
    if (error) throw error

    showToast(editId ? 'Anggota diperbarui' : 'Anggota ditambahkan')
    closeModal('modalOverlay')
    fetchTim()
  } catch (err) {
    showToast('Gagal menyimpan: ' + err.message, 'error')
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan'
  }
}

async function handleDelete(m) {
  if (!confirmDel(`Hapus ${m.nama}?`)) return
  if (m.foto_url) {
    const path = m.foto_url.split('/foto-tim/')[1]
    if (path) await sb.storage.from('foto-tim').remove([path])
  }
  const { error } = await sb.from('tim').delete().eq('id', m.id)
  if (error) { showToast('Gagal menghapus', 'error'); return }
  showToast('Anggota dihapus')
  fetchTim()
}

async function toggleAktif(id, current) {
  await sb.from('tim').update({ aktif: !current }).eq('id', id)
  fetchTim()
}

document.addEventListener('DOMContentLoaded', async () => {
  const session = await checkAuth()
  if (!session) return
  initSidebar('tim.html')
  initAdminHeader()
  fetchTim()
})
</script>
