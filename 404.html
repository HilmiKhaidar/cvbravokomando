<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="icon" href="images/favicon.png" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .notfound-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #f8fafc;
      text-align: center;
    }
    .notfound-code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #0ea5e9, #1e40af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    .notfound-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: .75rem;
    }
    .notfound-desc {
      color: #64748b;
      font-size: .95rem;
      max-width: 28rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .notfound-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .notfound-logo {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 3rem;
      text-decoration: none;
    }
    .notfound-logo-text p { margin: 0; line-height: 1.2; }
    .notfound-logo-title { font-size: .8rem; font-weight: 800; color: #1e293b; letter-spacing: .05em; }
    .notfound-logo-sub   { font-size: .7rem; font-weight: 600; color: #0ea5e9; letter-spacing: .08em; }
  </style>
</head>
<body>
<div class="notfound-wrap">
  <a href="index.html" class="notfound-logo">
    <img src="images/bkGroup.png" alt="PT. Bravo Komando Group" width="44" height="44" />
    <div class="notfound-logo-text">
      <p class="notfound-logo-title">PT. BRAVO KOMANDO</p>
      <p class="notfound-logo-sub">GROUP</p>
    </div>
  </a>

  <div class="notfound-actions">
    <a href="index.html" class="btn-primary">Kembali ke Beranda</a>
